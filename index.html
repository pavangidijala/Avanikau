<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avanika</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #16171b;
    color: #f2f0e9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid #2a2b31;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: #e8543a;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12px; color: #8b8c93; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #e8543a;
    color: #1a0e0a;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #23242b;
    color: #f2f0e9;
    border-bottom-left-radius: 4px;
  }
  .msg.typing { color: #8b8c93; font-style: italic; }
  #inputRow {
    display: flex;
    padding: 14px;
    gap: 10px;
    border-top: 1px solid #2a2b31;
  }
  #inputRow input {
    flex: 1;
    background: #23242b;
    border: 1px solid #34353d;
    border-radius: 999px;
    padding: 12px 16px;
    color: #f2f0e9;
    font-size: 15px;
    outline: none;
  }
  #inputRow input:focus { border-color: #e8543a; }
  #inputRow button {
    background: #e8543a;
    color: #1a0e0a;
    border: none;
    border-radius: 999px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #inputRow button:active { transform: scale(0.97); }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: #34353d; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="avatar">🔥</div>
  <div>
    <h1>Avanika</h1>
    <p>Not your average assistant. Zero filter.</p>
  </div>
</header>

<div id="chat"></div>

<div id="inputRow">
  <input type="text" id="userInput" placeholder="Say something..." autocomplete="off" />
  <button id="sendBtn">Send</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

let history = [];

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  history.push({ role: 'user', content: text });
  input.value = '';
  sendBtn.disabled = true;

  const typingDiv = addMessage('typing...', 'bot typing');

  try {
    // Calls OUR OWN backend (/api/chat), which safely holds the Groq key server-side.
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const data = await response.json();
    typingDiv.remove();

    if (data.error) {
      addMessage("Server says: " + data.error, 'bot');
    } else {
      const reply = data.reply || "Hmm, I got nothing. Try again.";
      addMessage(reply, 'bot');
      history.push({ role: 'assistant', content: reply });
    }
  } catch (err) {
    typingDiv.remove();
    addMessage("Something broke. Even I can't roast this bug.", 'bot');
    console.error(err);
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

addMessage("ఏంటి సంగతి, ఇలా వచ్చావు? ఏం కావాలో త్వరగా చెప్పు.", 'bot');
</script>

</body>
</html>
